name: Continuous IELTS Speaking Queue Controller
on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
permissions:
  contents: read
  actions: write
concurrency:
  group: ielts-speaking-continuous-controller
  cancel-in-progress: false
jobs:
  watch:
    if: github.repository == 'mstrangtrieueducation-droid/ielts-grader-runner' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.SPEAKING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
      - name: Check scheduler safeguards
        run: node continuous-dispatcher-tests.mjs
      - name: Install Python Google transport
        run: python3 -m pip install --quiet 'cryptography>=45,<47'
      - name: Keep one Speaking writer moving and poll for new submissions
        env:
          GRADING_LANE: ielts
          SPEAKING_ENABLED: ${{ vars.SPEAKING_ENABLED }}
          GITHUB_TOKEN: ${{ github.token }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IELTS_RUNNER_CONFIG_GZIP_B64: ${{ secrets.IELTS_RUNNER_CONFIG_GZIP_B64 }}
        run: node continuous-dispatcher.mjs
