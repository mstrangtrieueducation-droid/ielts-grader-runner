name: Grade IELTS Pipeline
run-name: Speaking grading enabled=${{ vars.SPEAKING_ENABLED }} mode=${{ inputs.mode || 'grade' }}
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Validate code, inspect private queue, or grade Speaking
        type: choice
        options: [validate, audit, grade]
        default: grade
permissions:
  contents: read
  actions: read
concurrency:
  group: ielts-speaking-single-writer
  cancel-in-progress: false
jobs:
  speaking:
    if: github.repository == 'mstrangtrieueducation-droid/ielts-grader-runner' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && (inputs.mode == 'validate' || inputs.mode == 'audit' || vars.SPEAKING_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODE: ${{ inputs.mode || 'grade' }}
      SPEAKING_ENABLED: ${{ vars.SPEAKING_ENABLED }}
      RUNNER_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      RUNNER_GITHUB_TOKEN: ${{ github.token }}
      GOOGLE_SHEETS_INTERVAL_MS: '6000'
      SHEET_TRUTH_SYNC: 'true'
      NATIVE_YOUTUBE_INPUT: 'true'
      GOOGLE_RATE_GATE_FILE: .runtime/google-rate.json
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Validate grading safeguards without provider calls
        env:
          SHEET_TRUTH_SYNC: 'false'
        run: |
          node hosted-bootstrap.mjs
          node entrypoint-preflight-tests.mjs
          node automatic-authorization-tests.mjs
          node speaking-provider-retry-tests.mjs
          node continuous-dispatcher-tests.mjs
          node lane-pool-tests.mjs
          node workload-lanes-tests.mjs
          node universal-media-tests.mjs
          node speaking-media-preprocessing-tests.mjs
          node screen-grounding-tests.mjs
          node ielts-speaking-tests.mjs
          node master-cross-class-sweep-tests.mjs
          node master-first-snapshot-tests.mjs
          node student-speech-evidence-tests.mjs
          node master-submission-scope-tests.mjs
          node saved-speaking-consistency-tests.mjs
          node speaking-returned-result-policy-tests.mjs
          node ielts-address-policy-tests.mjs
          node feedback-alignment-tests.mjs
          node feedback-contrast-tests.mjs
          node --check run-speaking.mjs
          node --check ielts-runner.mjs
      - name: Verify Python transport without network or AI calls
        run: |
          python3 -m pip install --quiet 'cryptography>=45,<47'
          python3 test-python-google.py
      - name: Validate teacher master policy without provider calls
        env:
          SHEET_TRUTH_SYNC: 'false'
        run: |
          node master-compact-output-tests.mjs
          node master-runtime-tests.mjs
          node completed-lease-owner-tests.mjs
          node sheet-truth-tests.mjs
          node sheet-truth-quota-tests.mjs
          node sheet-truth-download-tests.mjs
          node sheet-truth-reconcile-tests.mjs
      - name: Install audio validation tools
        if: env.MODE != 'validate'
        run: |
          python3 -m pip install --quiet --timeout 30 --retries 2 -r requirements.txt
          if ! command -v ffmpeg >/dev/null 2>&1 || ! ffmpeg -version >/dev/null 2>&1; then
            python3 -m pip install --quiet --timeout 30 --retries 2 'imageio-ffmpeg==0.6.0'
            media_bin="$RUNNER_TEMP/teacher-media-tools"
            mkdir -p "$media_bin"
            ffmpeg_exe=$(python3 -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')
            ln -sf "$ffmpeg_exe" "$media_bin/ffmpeg"
            "$media_bin/ffmpeg" -version >/dev/null
            echo "$media_bin" >> "$GITHUB_PATH"
            echo "FFMPEG_PATH=$media_bin/ffmpeg" >> "$GITHUB_ENV"
          fi
      - name: Restore encrypted media cache
        if: inputs.mode != 'validate'
        continue-on-error: true
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/encrypted-media-cache.bin
          key: grading-media-v1-${{ runner.os }}-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: grading-media-v1-${{ runner.os }}-${{ github.repository_id }}-
      - name: Authenticate and recover media files locally
        if: inputs.mode != 'validate'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node encrypted-media-cache.mjs restore
      - name: Audit or grade on the dedicated Speaking project
        if: env.MODE != 'validate'
        env:
          GEMINI_KEY_IELTS_SPEAKING: ${{ secrets.GEMINI_KEY_IELTS_SPEAKING }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IELTS_RUNNER_CONFIG_GZIP_B64: ${{ secrets.IELTS_RUNNER_CONFIG_GZIP_B64 }}
          IELTS_SPEAKING_BAREM_GZIP_B64: ${{ secrets.IELTS_SPEAKING_BAREM_GZIP_B64 }}
        run: python3 run.py

      - name: Encrypt retained media for the successor
        if: always() && inputs.mode != 'validate'
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node encrypted-media-cache.mjs save
      - name: Save only authenticated encrypted cache
        if: always() && inputs.mode != 'validate'
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: .runtime/encrypted-media-cache.bin
          key: grading-media-v1-${{ runner.os }}-${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
